<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>画像を軽くする | 2foods</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Meiryo UI", "Hiragino Kaku Gothic ProN", sans-serif; background: #f7f7f7; color: #333; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 16px; }
  h1 { font-size: 20px; font-weight: bold; margin-bottom: 6px; }
  .sub { font-size: 13px; color: #888; margin-bottom: 32px; }

  .drop-zone {
    width: 100%; max-width: 560px; border: 2.5px dashed #ccc; border-radius: 12px;
    background: #fff; padding: 48px 24px; text-align: center; cursor: pointer;
    transition: border-color .2s, background .2s;
  }
  .drop-zone.hover { border-color: #4CAF50; background: #f0faf0; }
  .drop-zone .icon { font-size: 40px; margin-bottom: 12px; }
  .drop-zone p { font-size: 15px; color: #666; line-height: 1.7; }
  .drop-zone input { display: none; }

  .settings { width: 100%; max-width: 560px; background: #fff; border-radius: 12px; padding: 24px; margin-top: 16px; }
  .settings label { font-size: 13px; font-weight: bold; color: #555; display: block; margin-bottom: 10px; }

  .presets { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .preset-btn {
    padding: 6px 16px; border: 1.5px solid #ddd; border-radius: 20px;
    background: #fff; font-size: 13px; cursor: pointer; transition: all .15s;
  }
  .preset-btn:hover { border-color: #4CAF50; color: #4CAF50; }
  .preset-btn.active { background: #4CAF50; color: #fff; border-color: #4CAF50; }

  .custom-row { display: flex; align-items: center; gap: 8px; }
  .custom-row input[type=number] {
    width: 100px; padding: 7px 12px; border: 1.5px solid #ddd; border-radius: 8px;
    font-size: 15px; text-align: center; outline: none;
  }
  .custom-row input[type=number]:focus { border-color: #4CAF50; }
  .custom-row span { font-size: 14px; color: #666; }

  .run-btn {
    width: 100%; max-width: 560px; margin-top: 20px; padding: 14px;
    background: #4CAF50; color: #fff; font-size: 16px; font-weight: bold;
    border: none; border-radius: 10px; cursor: pointer; transition: background .2s;
  }
  .run-btn:hover:not(:disabled) { background: #43a047; }
  .run-btn:disabled { background: #ccc; cursor: default; }

  .results { width: 100%; max-width: 560px; margin-top: 20px; }
  .result-item {
    background: #fff; border-radius: 10px; padding: 14px 18px;
    margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between;
    border-left: 4px solid #4CAF50;
  }
  .result-item.error { border-left-color: #f44336; }
  .result-info { font-size: 13px; }
  .result-name { font-weight: bold; margin-bottom: 3px; word-break: break-all; }
  .result-size { color: #888; font-size: 12px; }
  .result-size .after { color: #4CAF50; font-weight: bold; }
  .dl-btn {
    padding: 6px 18px; background: #1976D2; color: #fff; border: none;
    border-radius: 6px; font-size: 13px; cursor: pointer; white-space: nowrap; margin-left: 12px;
    transition: background .15s;
  }
  .dl-btn:hover { background: #1565c0; }
</style>
</head>
<body>

<h1>🖼 画像を軽くする</h1>
<p class="sub">JPEG / PNG をドラッグ&ドロップ → 目標サイズを選んで変換</p>

<div class="drop-zone" id="dropZone">
  <div class="icon">📂</div>
  <p>ここに画像をドラッグ&ドロップ<br><small style="color:#aaa">クリックしてファイルを選択することもできます</small></p>
  <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" multiple>
</div>

<div class="settings">
  <label>目標ファイルサイズ</label>
  <div class="presets" id="presets">
    <button class="preset-btn" data-kb="100">100 KB</button>
    <button class="preset-btn active" data-kb="300">300 KB</button>
    <button class="preset-btn" data-kb="500">500 KB</button>
    <button class="preset-btn" data-kb="1024">1 MB</button>
    <button class="preset-btn" data-kb="3072">3 MB</button>
  </div>
  <div class="custom-row">
    <input type="number" id="targetKB" value="300" min="10" max="20480">
    <span>KB 以下</span>
  </div>
</div>

<button class="run-btn" id="runBtn" disabled>変換する</button>

<div class="results" id="results"></div>

<script>
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const targetKBInput = document.getElementById('targetKB');
const runBtn = document.getElementById('runBtn');
const resultsDiv = document.getElementById('results');
let files = [];

// ドラッグ&ドロップ
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('hover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('hover'));
dropZone.addEventListener('drop', e => {
  e.preventDefault(); dropZone.classList.remove('hover');
  setFiles([...e.dataTransfer.files].filter(f => f.type.startsWith('image/')));
});
dropZone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => setFiles([...fileInput.files]));

function setFiles(f) {
  files = f;
  if (files.length === 0) return;
  dropZone.querySelector('p').innerHTML = `<strong>${files.length} ファイル選択済み</strong><br><small style="color:#aaa">${files.map(f=>f.name).join('、')}</small>`;
  runBtn.disabled = false;
  resultsDiv.innerHTML = '';
}

// プリセット
document.getElementById('presets').addEventListener('click', e => {
  const btn = e.target.closest('.preset-btn');
  if (!btn) return;
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  targetKBInput.value = btn.dataset.kb;
});
targetKBInput.addEventListener('input', () => {
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
});

// 変換
runBtn.addEventListener('click', async () => {
  const targetKB = parseInt(targetKBInput.value);
  if (!targetKB || targetKB < 10) return alert('目標サイズを入力してください');
  runBtn.disabled = true;
  runBtn.textContent = '変換中...';
  resultsDiv.innerHTML = '';

  for (const file of files) {
    const item = document.createElement('div');
    item.className = 'result-item';
    item.innerHTML = `<div class="result-info"><div class="result-name">${file.name}</div><div class="result-size">処理中...</div></div>`;
    resultsDiv.appendChild(item);

    try {
      const { blob, origKB, outKB, outExt } = await compress(file, targetKB);
      const outName = file.name.replace(/\.(jpe?g|png|webp)$/i, `_compressed.${outExt}`);
      item.querySelector('.result-size').innerHTML =
        `${origKB} KB → <span class="after">${outKB} KB</span>`;
      const dlBtn = document.createElement('button');
      dlBtn.className = 'dl-btn';
      dlBtn.textContent = 'ダウンロード';
      dlBtn.addEventListener('click', () => download(blob, outName));
      item.appendChild(dlBtn);
      // 自動ダウンロード
      download(blob, outName);
    } catch (e) {
      item.classList.add('error');
      item.querySelector('.result-size').textContent = 'エラー: ' + e.message;
    }
  }

  runBtn.disabled = false;
  runBtn.textContent = '変換する';
});

async function compress(file, targetKB) {
  const isPNG = file.type === 'image/png';
  const origKB = Math.round(file.size / 1024);
  const img = await loadImage(file);
  const targetBytes = targetKB * 1024;

  const canvas = document.createElement('canvas');
  canvas.width = img.width;
  canvas.height = img.height;
  canvas.getContext('2d').drawImage(img, 0, 0);

  // PNGの場合: そのままで目標以下なら変換不要
  if (isPNG) {
    const blob = await toBlob(canvas, 1, 'image/png');
    if (blob.size <= targetBytes) {
      return { blob, origKB, outKB: Math.round(blob.size / 1024), outExt: 'png' };
    }
  }

  // JPEG品質二分探索（フルサイズ）
  // PNG超過時もJPEGに変換して圧縮（PNGはquality無効なのでJPEG変換が必要）
  let best = await binarySearchQuality(canvas, targetBytes);

  // ダメなら寸法縮小 + 品質二分探索の組み合わせ
  if (!best) {
    for (const scale of [0.9, 0.8, 0.7, 0.6, 0.5, 0.4, 0.3, 0.2]) {
      const c2 = document.createElement('canvas');
      c2.width = Math.round(img.width * scale);
      c2.height = Math.round(img.height * scale);
      c2.getContext('2d').drawImage(img, 0, 0, c2.width, c2.height);
      best = await binarySearchQuality(c2, targetBytes);
      if (best) break;
    }
  }

  if (!best) throw new Error('目標サイズに圧縮できませんでした');
  return { blob: best, origKB, outKB: Math.round(best.size / 1024), outExt: 'jpg' };
}

// 指定キャンバスでJPEG品質を二分探索し、目標バイト以下の最高品質blobを返す
// 最低品質(0.01)でも超える場合は null を返す
async function binarySearchQuality(canvas, targetBytes) {
  const minBlob = await toBlob(canvas, 0.01, 'image/jpeg');
  if (minBlob.size > targetBytes) return null;

  let lo = 0.01, hi = 0.92, best = minBlob;
  for (let i = 0; i < 16; i++) {
    const mid = (lo + hi) / 2;
    const blob = await toBlob(canvas, mid, 'image/jpeg');
    if (blob.size <= targetBytes) { best = blob; lo = mid; }
    else { hi = mid; }
  }
  return best;
}

function loadImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = reject;
    img.src = url;
  });
}

function toBlob(canvas, quality, mime = 'image/jpeg') {
  return new Promise(resolve => canvas.toBlob(resolve, mime, quality));
}

function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
</script>
</body>
</html>
